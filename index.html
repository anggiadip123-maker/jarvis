<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>JARVIS</title>
<style>
  :root{--c:#00d4ff;--bg:#02060d}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 30%,#06223a,var(--bg) 70%);color:#cfefff;font-family:Segoe UI,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  h1{letter-spacing:.5em;font-weight:300;color:var(--c);margin:8px 0}
  #orb{width:150px;height:150px;border-radius:50%;margin:14px 0;border:2px solid var(--c);box-shadow:0 0 30px var(--c),inset 0 0 30px var(--c);background:radial-gradient(circle,#0a4a6a,transparent 70%);cursor:pointer;transition:.3s}
  #orb.listen{animation:p 1s infinite;box-shadow:0 0 60px #4dff9d,inset 0 0 40px #4dff9d;border-color:#4dff9d}
  #orb.speak{animation:p .5s infinite;box-shadow:0 0 60px #ffb84d,inset 0 0 40px #ffb84d;border-color:#ffb84d}
  @keyframes p{50%{transform:scale(1.12)}}
  #status{color:var(--c);font-size:.9rem;min-height:1.2em}
  #log{width:100%;max-width:720px;flex:1;overflow:auto;margin:12px 0;display:flex;flex-direction:column;gap:8px}
  .m{padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;line-height:1.4}
  .u{align-self:flex-end;background:#0b3b55}
  .j{align-self:flex-start;background:#0a1d2e;border:1px solid #124a6b}
  form{display:flex;gap:8px;width:100%;max-width:720px}
  input,button,select{font:inherit;border-radius:10px;border:1px solid #124a6b;background:#07131f;color:#cfefff;padding:10px}
  input{flex:1}
  button{cursor:pointer;color:var(--c)}
  button:hover{background:#0b2a40}
  details{max-width:720px;width:100%;font-size:.85rem;margin-top:8px}
  details input{width:100%;margin-top:6px}
  a{color:var(--c)}
</style>
</head>
<body>
<h1>JARVIS</h1>
<div id="orb" title="Klik untuk bicara"></div>
<div id="status">Klik bola atau ketik. Ucapkan "Jarvis ..." pada mode siaga.</div>
<div id="log"></div>
<form id="f"><input id="t" placeholder="Ketik perintah..." autocomplete="off"><button>Kirim</button><button type="button" id="standby">Siaga: mati</button></form>
<details id="set"><summary>Pengaturan AI (API key gratis)</summary>
  <p>Pilih AI utama. Isi key untuk satu atau lebih AI di bawah; kalau satu gagal atau sibuk, Jarvis otomatis mencoba AI lain yang punya key. Key hanya disimpan di browser Anda.</p>
  <select id="prov"></select>
  <div id="provs"></div>
</details>
<script>
const $=id=>document.getElementById(id);
const log=$('log'),orb=$('orb'),status=$('status');
const store={get:k=>{try{return localStorage.getItem(k)||''}catch{return''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
// UI pengaturan dibuat setelah PROV didefinisikan (lihat initSettings)

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,standby=false,busy=false,history=[];

function add(txt,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight}
function setS(t,m){status.textContent=t;orb.className=m||''}

// TTS gratis Google (suara Indonesia), dipecah per kalimat <=180 karakter
function chunks(text){
  const parts=text.replace(/[*#`_]/g,'').match(/[^.!?\n]+[.!?]?/g)||[text];
  const out=[];
  for(let p of parts){
    p=p.trim(); if(!p)continue;
    while(p.length>180){let i=p.lastIndexOf(' ',180); if(i<1)i=180; out.push(p.slice(0,i)); p=p.slice(i).trim()}
    if(p)out.push(p);
  }
  return out;
}
function playChunk(t){
  return new Promise((ok,fail)=>{
    const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=id&q='+encodeURIComponent(t));
    window._a=a; a.onended=ok; a.onerror=()=>fail(new Error('tts')); a.play().catch(fail);
  });
}
async function speak(text){
  speechSynthesis.cancel(); if(window._a)window._a.pause();
  setS('Berbicara...','speak');
  try{
    for(const c of chunks(text))await playChunk(c);
    setS('Siap.');
  }catch{ await speakBrowser(text) }
}
function speakBrowser(text){
  return new Promise(res=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/[*#`_]/g,''));
    u.lang='id-ID';
    const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('id'));
    if(v)u.voice=v;
    u.onstart=()=>setS('Berbicara...','speak');
    u.onend=u.onerror=()=>{setS('Siap.');res()};
    speechSynthesis.speak(u);
  });
}

// ===== Kemampuan lokal (tanpa AI) =====
const SITES={youtube:'https://youtube.com',gmail:'https://mail.google.com',email:'https://mail.google.com',maps:'https://maps.google.com',peta:'https://maps.google.com',whatsapp:'https://web.whatsapp.com',wa:'https://web.whatsapp.com',facebook:'https://facebook.com',fb:'https://facebook.com',instagram:'https://instagram.com',ig:'https://instagram.com',tiktok:'https://tiktok.com',tokopedia:'https://tokopedia.com',shopee:'https://shopee.co.id',github:'https://github.com',twitter:'https://x.com',x:'https://x.com',drive:'https://drive.google.com',spotify:'https://open.spotify.com',netflix:'https://netflix.com',tradingview:'https://tradingview.com',translate:'https://translate.google.com',telegram:'https://web.telegram.org'};
const HELP='Saya bisa: jadwal meeting ("jadwal besok jam 9 meeting klien" - saya ingatkan sendiri); pantau aplikasi ("pantau https://appku.com" - saya beri tahu kalau mati); jam & tanggal; timer/pengingat ("timer 5 menit"); catatan ("catat beli beras", "lihat catatan", "hapus catatan"); hitung ("hitung 12 kali 5 tambah 3"); cuaca ("cuaca Jakarta"); kurs ("kurs 100 usd ke idr"); info Wikipedia ("siapa itu Soekarno"); dadu, koin, angka acak; cari Google, putar YouTube, buka situs (WhatsApp, Gmail, Maps, dll); dan ngobrol apa saja lewat AI (terjemahan, resep, ide, tulis pesan, dll).';
const openUrl=(url,msg)=>{window.open(url,'_blank');return msg};
const num=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:2});
const notes=()=>{try{return JSON.parse(store.get('jn')||'[]')}catch{return[]}};

async function jget(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}

async function cuaca(kota){
  const g=await jget('https://geocoding-api.open-meteo.com/v1/search?count=1&language=id&name='+encodeURIComponent(kota));
  const p=g.results?.[0]; if(!p)return 'Kota '+kota+' tidak ditemukan.';
  const w=(await jget(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&timezone=auto`)).current;
  const kode={0:'cerah',1:'cerah berawan',2:'berawan',3:'mendung',45:'berkabut',48:'berkabut',51:'gerimis',53:'gerimis',55:'gerimis lebat',61:'hujan ringan',63:'hujan',65:'hujan lebat',80:'hujan lokal',81:'hujan lokal',82:'hujan deras',95:'badai petir',96:'badai petir',99:'badai petir'}[w.weather_code]||'cuaca tidak diketahui';
  return `Cuaca di ${p.name}: ${kode}, suhu ${w.temperature_2m} derajat Celsius, kelembapan ${w.relative_humidity_2m} persen, angin ${w.wind_speed_10m} kilometer per jam.`;
}

async function kurs(jml,dari,ke){
  const j=await jget('https://open.er-api.com/v6/latest/'+dari);
  const rate=j.rates?.[ke]; if(!rate)return 'Mata uang tidak dikenal.';
  return `${num(jml)} ${dari} sekitar ${num(jml*rate)} ${ke}.`;
}

async function wiki(topik){
  const j=await jget('https://id.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(topik.trim().replace(/ /g,'_')));
  if(!j.extract||j.type==='disambiguation')return null;
  return j.extract.split('. ').slice(0,3).join('. ')+'.';
}

function hitung(s){
  let e=s.replace(/,/g,'.').replace(/\b(kali|dikali|x)\b/g,'*').replace(/\b(bagi|dibagi)\b/g,'/').replace(/\b(tambah|ditambah|plus)\b/g,'+').replace(/\b(kurang|dikurang|minus)\b/g,'-').replace(/\bpangkat\b/g,'**').replace(/(\d+(?:\.\d+)?)\s*persen dari\s*(\d+(?:\.\d+)?)/g,'($1/100*$2)').replace(/[^0-9+\-*/().% ]/g,'').trim();
  if(!/\d/.test(e)||!/[+\-*/%]/.test(e))return null;
  try{const v=Function('"use strict";return ('+e+')')();return isFinite(v)?'Hasilnya '+num(v):null}catch{return null}
}

const timers=[];
function setTimer(n,unit,label){
  const ms=n*({detik:1,menit:60,jam:3600}[unit])*1000;
  const t=setTimeout(()=>{const m='Waktu habis, Bos! '+(label?label:n+' '+unit+' sudah berlalu.');add(m,'j');speak(m);try{new Notification('JARVIS',{body:m})}catch{}},ms);
  timers.push(t);
  try{if(Notification.permission==='default')Notification.requestPermission()}catch{}
  return `Baik, timer ${n} ${unit}${label?' untuk '+label:''} dimulai.`;
}

// ===== Proaktif: jadwal meeting & pantau aplikasi (notifikasi tanpa disuruh) =====
function pushAlert(msg){add(msg,'j');speak(msg);try{new Notification('JARVIS',{body:msg})}catch{}}
const load=(k)=>{try{return JSON.parse(store.get(k)||'[]')}catch{return[]}};
const save=(k,v)=>store.set(k,JSON.stringify(v));

function tambahJadwal(hari,jam,mnt,txt){
  const d=new Date(); if(hari==='besok')d.setDate(d.getDate()+1);
  d.setHours(+jam,+(mnt||0),0,0);
  if(d<new Date()&&!hari)d.setDate(d.getDate()+1);
  const a=load('ja'); a.push({t:d.getTime(),txt:txt||'Meeting',pre:false,now:false}); a.sort((x,y)=>x.t-y.t); save('ja',a);
  try{if(Notification.permission==='default')Notification.requestPermission()}catch{}
  return `Siap. Jadwal "${txt||'Meeting'}" dicatat ${d.toLocaleString('id-ID',{weekday:'long',hour:'2-digit',minute:'2-digit'})}. Saya akan mengingatkan 10 menit sebelumnya dan saat waktunya.`;
}
function cekJadwal(){
  const a=load('ja'),now=Date.now();let ch=false;
  for(const j of a){
    if(!j.pre&&!j.now&&j.t-now<=600000&&j.t-now>0){j.pre=true;ch=true;pushAlert('Pengingat, Bos: '+j.txt+' dimulai sekitar 10 menit lagi.')}
    if(!j.now&&j.t<=now&&now-j.t<3600000){j.now=true;ch=true;pushAlert('Bos, sekarang waktunya: '+j.txt+'.')}
  }
  const keep=a.filter(j=>now-j.t<3600000);
  if(ch||keep.length!==a.length)save('ja',keep);
}

async function cekPantau(){
  const a=load('jp');let ch=false;
  for(const p of a){
    let up=true;
    try{const c=new AbortController();setTimeout(()=>c.abort(),8000);await fetch(p.url,{mode:'no-cors',cache:'no-store',signal:c.signal})}catch{up=false}
    if(up!==p.up){
      if(p.up!==undefined)pushAlert(up?'Kabar baik, Bos: '+p.url+' sudah pulih dan bisa diakses lagi.':'Peringatan, Bos! Aplikasi '+p.url+' tidak bisa diakses. Kemungkinan ada masalah.');
      p.up=up;ch=true;
    }
  }
  if(ch)save('jp',a);
}
setInterval(cekJadwal,20000);setTimeout(cekJadwal,2000);
setInterval(cekPantau,60000);setTimeout(cekPantau,5000);

function local(q){
  const s=q.toLowerCase().trim().replace(/^jarvis[, ]*/,'');
  let m;
  if(m=s.match(/jadwal(?:kan)?\s*(besok|hari ini)?\s*(?:jam|pukul)\s*(\d{1,2})(?:[.:](\d{2}))?\s*(.*)/))return tambahJadwal(m[1]==='hari ini'?'':m[1],m[2],m[3],m[4].trim());
  if(/lihat jadwal|daftar jadwal|jadwal saya|agenda/.test(s)){const a=load('ja');return a.length?'Jadwal Anda: '+a.map(j=>new Date(j.t).toLocaleString('id-ID',{weekday:'short',hour:'2-digit',minute:'2-digit'})+' '+j.txt).join('; '):'Belum ada jadwal.'}
  if(/hapus (semua )?jadwal/.test(s)){save('ja',[]);return 'Semua jadwal dihapus.'}
  if(m=s.match(/(?:pantau|monitor)\s+(\S+)/)){let u=m[1];if(!/^https?:/.test(u))u='https://'+u;const a=load('jp');if(!a.some(x=>x.url===u))a.push({url:u});save('jp',a);try{if(Notification.permission==='default')Notification.requestPermission()}catch{}return 'Baik, saya pantau '+u+' tiap menit dan akan memberi tahu kalau mati atau pulih. Biarkan tab ini tetap terbuka.'}
  if(/daftar pantau|lihat pantau/.test(s)){const a=load('jp');return a.length?'Dipantau: '+a.map(x=>x.url+(x.up===false?' (MATI)':x.up?' (hidup)':'')).join('; '):'Belum ada yang dipantau.'}
  if(/hapus (semua )?pantau/.test(s)){save('jp',[]);return 'Semua pantauan dihapus.'}
  if(/bisa apa|bantuan|fitur|kemampuan|help/.test(s))return HELP;
  if(/jam berapa|waktu sekarang/.test(s))return 'Sekarang pukul '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  if(/tanggal berapa|hari apa|tanggal hari ini/.test(s))return 'Hari ini '+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  if(m=s.match(/(?:timer|alarm|ingatkan(?: saya)?(?: dalam)?|ingetin)\s*(\d+)\s*(detik|menit|jam)\s*(.*)/))return setTimer(+m[1],m[2],m[3].replace(/^(untuk|buat|lagi)\s+/,'').trim());
  if(/batalkan timer|hentikan timer/.test(s)){timers.splice(0).forEach(clearTimeout);return 'Semua timer dibatalkan.'}

  if(m=s.match(/^(?:catat|catatan:?|ingat bahwa|tulis)\s+(.+)/)){const n=notes();n.push(m[1]);store.set('jn',JSON.stringify(n));return 'Dicatat: '+m[1]}
  if(/lihat catatan|baca catatan|daftar catatan|catatan saya/.test(s)){const n=notes();return n.length?'Catatan Anda: '+n.map((x,i)=>(i+1)+'. '+x).join('; '):'Belum ada catatan.'}
  if(/hapus (semua )?catatan/.test(s)){store.set('jn','[]');return 'Semua catatan dihapus.'}

  if(m=s.match(/(?:cuaca|suhu|hujan)(?: di| kota)?\s*(.*)/))return cuaca(m[1].replace(/^(hari ini|sekarang)$/,'').trim()||'Jakarta').catch(()=>'Gagal mengambil data cuaca.');
  if(m=s.match(/kurs\s+(?:(\d+(?:[.,]\d+)?)\s*)?([a-z]{3})(?:\s+(?:ke|to|jadi)\s+([a-z]{3}))?/))return kurs(parseFloat((m[1]||'1').replace(',','.')),m[2].toUpperCase(),(m[3]||'idr').toUpperCase()).catch(()=>'Gagal mengambil kurs.');
  if(m=s.match(/^(?:siapa itu|siapa|apa itu|apa yang dimaksud dengan|wikipedia)\s+(.+)/))return wiki(m[1]).catch(()=>null);

  if(/lempar dadu|kocok dadu|dadu/.test(s))return 'Dadu menunjukkan angka '+(1+Math.floor(Math.random()*6));
  if(/lempar koin|koin/.test(s))return Math.random()<.5?'Hasilnya: Gambar':'Hasilnya: Angka';
  if(m=s.match(/angka acak(?: antara)?\s*(\d+)\s*(?:sampai|sd|-|dan)\s*(\d+)/))return 'Angka acaknya '+(+m[1]+Math.floor(Math.random()*(+m[2]-+m[1]+1)));
  if(/hapus riwayat|reset obrolan|lupakan/.test(s)){history=[];log.innerHTML='';return 'Riwayat obrolan dibersihkan.'}

  if(m=s.match(/(?:hitung|berapa)\s+(.+)/)){const h=hitung(m[1]);if(h)return h}
  if(m=s.match(/(?:cari|google)\s+(.+)/))return openUrl('https://www.google.com/search?q='+encodeURIComponent(m[1]),'Mencari '+m[1]);
  if(m=s.match(/(?:putar|youtube)\s+(.+)/))return openUrl('https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]),'Memutar '+m[1]+' di YouTube');
  if(m=s.match(/(?:buka|open)\s+(\w+)/)){const u=SITES[m[1]];if(u)return openUrl(u,'Membuka '+m[1])}
  return null;
}


// ===== Banyak AI: Gemini, Groq, OpenRouter, Mistral (key gratis masing-masing) =====
const SYS='Kamu JARVIS, asisten AI pribadi yang sopan, cerdas, dan ringkas. Jawab dalam bahasa Indonesia, maksimal 3 kalimat kecuali diminta detail. Panggil pengguna "Bos".';
const PROV={
  gemini:{name:'Gemini',model:'gemini-3.8-flash',link:'https://aistudio.google.com/apikey'},
  groq:{name:'Groq',model:'llama-3.3-70b-versatile',url:'https://api.groq.com/openai/v1/chat/completions',link:'https://console.groq.com/keys'},
  openrouter:{name:'OpenRouter',model:'meta-llama/llama-3.3-70b-instruct:free',url:'https://openrouter.ai/api/v1/chat/completions',link:'https://openrouter.ai/keys'},
  mistral:{name:'Mistral',model:'mistral-small-latest',url:'https://api.mistral.ai/v1/chat/completions',link:'https://console.mistral.ai/api-keys'}
};
const pkey=p=>store.get('k_'+p)||(p==='gemini'?store.get('jk'):'');
const pmodel=p=>{const m=store.get('m_'+p);return m&&!/gemini-2\.0/.test(m)?m:PROV[p].model};
(function initSettings(){
  const sel=$('prov'),box=$('provs');
  for(const p in PROV){
    const o=document.createElement('option');o.value=p;o.textContent=PROV[p].name;sel.appendChild(o);
    const d=document.createElement('div');d.style.marginTop='8px';
    d.innerHTML=`<b>${PROV[p].name}</b> - <a href="${PROV[p].link}" target="_blank">ambil key gratis</a><input type="password" id="k_${p}" placeholder="API key ${PROV[p].name}"><input id="m_${p}" placeholder="Model">`;
    box.appendChild(d);
    const k=d.querySelector('#k_'+p),m=d.querySelector('#m_'+p);
    k.value=pkey(p);m.value=pmodel(p);
    k.onchange=()=>store.set('k_'+p,k.value.trim());
    m.onchange=()=>store.set('m_'+p,m.value.trim());
  }
  sel.value=store.get('prov')||'gemini';
  sel.onchange=()=>store.set('prov',sel.value);
})();
async function askOAI(p,key,model){
  const msgs=[{role:'system',content:SYS},...history.map(h=>({role:h.role==='model'?'assistant':'user',content:h.parts[0].text}))];
  for(let i=0;i<2;i++){
    try{
      const r=await fetch(PROV[p].url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:msgs,max_tokens:600})});
      const j=await r.json();
      if(j.error||!r.ok){const m=(j.error&&(j.error.message||j.error))||('HTTP '+r.status);if([429,500,503].includes(r.status)&&!i){await new Promise(z=>setTimeout(z,1500));continue}return{err:PROV[p].name+': '+m}}
      return{text:j.choices?.[0]?.message?.content||'Maaf, tidak ada jawaban.'};
    }catch(e){return{err:PROV[p].name+': gagal terhubung ('+e.message+')'}}
  }
  return{err:PROV[p].name+': server sibuk'};
}
async function ask(q){
  history.push({role:'user',parts:[{text:q}]});
  history=history.slice(-20);
  const sel=$('prov').value;
  const order=[sel,...Object.keys(PROV).filter(p=>p!==sel)].filter(p=>pkey(p));
  if(!order.length){history.pop();return 'Masukkan minimal satu API key gratis di Pengaturan dulu (Gemini, Groq, OpenRouter, atau Mistral).'}
  let last='';
  for(const p of order){
    if(p!==order[0])setS('Mencoba '+PROV[p].name+'...');
    const r=p==='gemini'?await askGemini(pkey(p),pmodel(p)):await askOAI(p,pkey(p),pmodel(p));
    if(r.text){history.push({role:'model',parts:[{text:r.text}]});return r.text}
    last=r.err||last;
  }
  history.pop();
  return last+' (coba lagi sebentar lagi)';
}
async function askGemini(key,model){
  const body=JSON.stringify({
    systemInstruction:{parts:[{text:'Kamu JARVIS, asisten AI pribadi yang sopan, cerdas, dan ringkas. Jawab dalam bahasa Indonesia, maksimal 3 kalimat kecuali diminta detail. Panggil pengguna "Bos".'}]},
    contents:history});
  let err='';
  const busyErr=j=>[429,500,503].includes(j.error.code)||/demand|overload|try again|quota/i.test(j.error.message);
  async function tryModel(m,tries){
    for(let i=0;i<tries;i++){
      try{
        if(i)setS('Server sibuk, mencoba lagi ('+i+'/'+(tries-1)+')...');
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`,{
          method:'POST',headers:{'Content-Type':'application/json'},body});
        const j=await r.json();
        if(j.error){
          err='Error ('+m+'): '+j.error.message;
          if(busyErr(j)){await new Promise(z=>setTimeout(z,1500*(i+1)));continue}
          return null;
        }
        return j.candidates?.[0]?.content?.parts?.[0]?.text||'Maaf, tidak ada jawaban.';
      }catch(e){err='Gagal terhubung: '+e.message;return null}
    }
    return null;
  }
  let a=await tryModel(model,3);
  if(a)return{text:a};
  // cadangan: coba model flash lain yang tersedia untuk key ini
  try{
    setS('Mencari model cadangan...');
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key='+key);
    const j=await r.json();
    const alt=(j.models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(x.name)&&!/image|tts|live|audio|thinking|exp/.test(x.name)).map(x=>x.name.replace('models/','')).filter(x=>x!==model).slice(0,4);
    for(const m of alt){a=await tryModel(m,1);if(a){store.set('m_gemini',m);return{text:a}}}
  }catch{}
  return{err:'Gemini: '+err};
}

async function handle(q){
  q=q.trim(); if(!q||busy)return;
  busy=true; add(q,'u'); setS('Berpikir...');
  let a=null;try{a=await local(q)}catch{}
  if(a==null)a=await ask(q);
  add(a,'j'); await speak(a); busy=false;
}

function listen(once){
  if(!SR){setS('Browser tidak mendukung suara. Pakai Chrome/Edge.');return}
  rec=new SR(); rec.lang='id-ID'; rec.interimResults=false;
  rec.onstart=()=>setS(standby?'Siaga: ucapkan "Jarvis ..."':'Mendengarkan...','listen');
  rec.onresult=e=>{
    let t=e.results[0][0].transcript;
    if(standby){
      if(!/jarvis|jarwis|jarvish/i.test(t))return;
      t=t.replace(/.*?(jarvis|jarwis|jarvish)[, ]*/i,'');
      if(!t){speak('Ya, Bos?');return}
    }
    handle(t);
  };
  rec.onend=()=>{orb.className=''; if(standby&&!busy)setTimeout(()=>listen(),300); else if(standby)setTimeout(()=>listen(),1500)};
  rec.onerror=e=>{if(e.error==='not-allowed'){standby=false;$('standby').textContent='Siaga: mati';setS('Izinkan akses mikrofon.')}};
  try{rec.start()}catch{}
}

orb.onclick=()=>{speechSynthesis.cancel();if(window._a)window._a.pause();listen(true)};
$('f').onsubmit=e=>{e.preventDefault();const v=$('t').value;$('t').value='';handle(v)};
$('standby').onclick=()=>{
  standby=!standby; $('standby').textContent='Siaga: '+(standby?'hidup':'mati');
  if(standby)listen(); else{try{rec.abort()}catch{} setS('Siap.')}
};
speechSynthesis.onvoiceschanged=()=>{};
add('Selamat datang, Bos. Saya JARVIS. Masukkan API key gratis di Pengaturan, lalu klik bola dan bicara.','j');
</script>
